name: Android

# Runs on every push to main (so a broken build is caught before a release), on pull
# requests, and on version tags - which is the only path that publishes a release.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

# Two pushes to the same branch do not both need to build; the newer one wins. Tags
# are never cancelled, because a cancelled tag build would leave the tag without its
# release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No local.properties is needed: the runner already has the Android SDK, and the
      # file holds this machine's SDK path and is git-ignored.
      - name: Verify and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      # One artifact per file, so the release job never has to guess how a
      # multi-path upload flattened its directory structure.
      - name: Upload the release APK
        uses: actions/upload-artifact@v7
        with:
          name: silverphone-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: silverphone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Publishing is not done here.
  #
  # The release APK must be signed with the SilverPhone release key, and that key is
  # deliberately not in CI: it is the one secret that cannot be rotated, and anything
  # that can read it can sign an update for every installed copy of this app. A tag
  # therefore only builds and tests, and the release is published from the machine that
  # holds the key - see docs/RELEASING.md. A run of this workflow is still the proof
  # that the tagged tree compiles and passes its tests.
